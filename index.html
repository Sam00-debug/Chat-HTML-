<body>


  <!-- =====================================================
       LOGIN
  ===================================================== -->

  <div
    class="login-screen"
    id="loginScreen"
  >

    <div class="login-card">

      <div class="login-logo">

      </div>

        welcome to Nothing Panel chat!! ;)

      <input

        placeholder="Enter your name"
      >

      <button
        class="login-button"
        onclick="login()"
      >
        Log in
      </button>

      <div
        class="login-error"
        id="loginError"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       CHAT APP
  ===================================================== -->

  <main class="app" id="app">


    <!-- TOP BAR -->

    <header class="topbar">

      <div class="brand">

        <div class="brand-logo">
          ☠️
        </div>

        <div class="brand-text">

          <div class="brand-title">
              NOTHING PANEL CHAT
          </div>

          <div class="brand-subtitle">
            Panel walo ki baat chit hoti idhr !!
          </div>

        </div>

      </div>


      <div
        class="connection"
        id="connection"
      >

        <span class="connection-dot"></span>

        <span id="connectionText">
          Connecting...
        </span>

      </div>

    </header>


    <!-- MESSAGES -->

    <section
      class="messages"
      id="messages"
    >

      <div
        class="empty"
        id="empty"
      >

        <div>

          <div class="empty-icon">
            🛞
          </div>

          <p>
            No messages yet.<br>
            Start the conversation!
          </p>

        </div>

      </div>

    </section>


    <!-- EMOJI PICKER -->

    <div
      class="emoji-picker"
      id="emojiPicker"
    ></div>


    <!-- BOTTOM -->

    <footer class="bottom-bar">

      <div class="composer">

        <input
          class="message-input"
          id="messageInput"
          type="text"
          maxlength="500"
          autocomplete="off"
          placeholder="Type a message..."
        >

        <button
          class="emoji-button"
          id="emojiButton"
          type="button"
          onclick="toggleEmojiPicker()"
          aria-label="Emoji"
        >
          😄
        </button>

        <button
          class="send-button"
          id="sendButton"
          type="button"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </footer>

  </main>


  <script>

    /* =====================================================
       SERVER
    ===================================================== */

    const SERVER_URL =
      "https://my-roblox-private-chat.onrender.com";


    /* =====================================================
       VARIABLES
    ===================================================== */

    let username = "";

    let lastMessageTime = 0;

    let loadingMessages = false;

    /*
      This is the main duplicate protection.

      Every displayed message gets a fingerprint.

      Even if Render returns the exact same message
      20 times, we only display it once.
    */

    const displayedMessages =
      new Set();


    /*
      Prevent old messages from being loaded again
      when polling.
    */

    let newestServerTime = 0;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginScreen =
      document.getElementById("loginScreen");

    const nameInput =
      document.getElementById("nameInput");

    const loginError =
      document.getElementById("loginError");

    const messagesElement =
      document.getElementById("messages");

    const emptyElement =
      document.getElementById("empty");

    const connection =
      document.getElementById("connection");

    const connectionText =
      document.getElementById("connectionText");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const emojiPicker =
      document.getElementById("emojiPicker");


    /* =====================================================
       NAME COLORS
    ===================================================== */

    const nameColors = [
      "#ff6b8a",
      "#ff9f43",
      "#ffd166",
      "#5ee1a2",
      "#55c7ff",
      "#7c8cff",
      "#b084ff",
      "#ff72d2",
      "#58d5c9",
      "#e989ff"
    ];


    /*
      Same username gets the same color.

      It looks random but stays consistent.
    */

    function getNameColor(name) {

      let hash = 0;

      for (
        let i = 0;
        i < name.length;
        i++
      ) {

        hash =
          name.charCodeAt(i) +
          ((hash << 5) - hash);

      }

      const index =
        Math.abs(hash) %
        nameColors.length;

      return nameColors[index];

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    function login() {

      const name =
        nameInput.value.trim();


      if (!name) {

        loginError.textContent =
          "Please enter a name.";

        return;

      }


      if (name.length < 2) {

        loginError.textContent =
          "Name must be at least 2 characters.";

        return;

      }


      username = name;

      localStorage.setItem(
        "mychat_username",
        username
      );


      loginScreen.style.display =
        "none";


      messageInput.focus();


      startChat();

    }


    /* =====================================================
       LOAD SAVED LOGIN
    ===================================================== */

    const savedUsername =
      localStorage.getItem(
        "mychat_username"
      );


    if (savedUsername) {

      username =
        savedUsername;

      loginScreen.style.display =
        "none";

      startChat();

    }


    /* =====================================================
       ENTER LOGIN
    ===================================================== */

    nameInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );


    /* =====================================================
       CONNECTION STATUS
    ===================================================== */

    function setConnection(
      type,
      text
    ) {

      connection.className =
        "connection " + type;

      connectionText.textContent =
        text;

    }


    /* =====================================================
       MESSAGE FINGERPRINT
    ===================================================== */

    function messageFingerprint(message) {

      /*
        Your Render server currently doesn't give
        every message a unique ID.

        So we create a strong fingerprint.

        Includes:
        - timestamp
        - username
        - message
        - source
        - jobId
      */

      return [
        String(message.time || ""),
        String(message.user || ""),
        String(message.msg || ""),
        String(message.source || ""),
        String(message.jobId || "")
      ].join("|||");

    }


    /* =====================================================
       LOAD MESSAGES
    ===================================================== */

    async function loadMessages() {

      /*
        VERY IMPORTANT:

        Don't allow multiple polling requests
        to overlap.

        This stops a common source of duplicates.
      */

      if (loadingMessages) {
        return;
      }

      loadingMessages = true;


      try {

        const response =
          await fetch(
            SERVER_URL +
            "/messages?since=" +
            encodeURIComponent(
              lastMessageTime
            ),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (!Array.isArray(data)) {

          throw new Error(
            "Invalid server response"
          );

        }


        setConnection(
          "connected",
          "Connected"
        );


        /*
          Sort messages oldest → newest.

          This keeps the chat ordered correctly.
        */

        data.sort(
          (a, b) =>
            Number(a.time || 0) -
            Number(b.time || 0)
        );


        data.forEach(
          addMessage
        );


      } catch (error) {

        console.error(
          "Message loading error:",
          error
        );


        setConnection(
          "error",
          "Connection error"
        );

      } finally {

        loadingMessages =
          false;

      }

    }


    /* =====================================================
       ADD MESSAGE
    ===================================================== */

    function addMessage(message) {

      /*
        Create fingerprint BEFORE rendering.
      */

      const id =
        messageFingerprint(message);


      /*
        THE IMPORTANT FIX:

        If we've already shown this exact message,
        completely ignore it.

        This protects against:
        - repeated polling
        - overlapping requests
        - duplicate server entries
        - immediate send + polling duplication
      */

      if (
        displayedMessages.has(id)
      ) {

        return;

      }


      displayedMessages.add(id);


      /*
        Update newest timestamp.

        IMPORTANT:
        We update this even for messages we display,
        so future requests only ask for newer messages.
      */

      const messageTime =
        Number(message.time || 0);


      if (
        messageTime >
        lastMessageTime
      ) {

        lastMessageTime =
          messageTime;

      }


      emptyElement.style.display =
        "none";


      /* MESSAGE */

      const wrapper =
        document.createElement("div");


      const isMine =
        message.user === username;


      wrapper.className =
        isMine
          ? "message mine"
          : "message";


      const content =
        document.createElement("div");

      content.className =
        "message-content";


      /* BUBBLE */

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      /* USERNAME */

      const user =
        document.createElement("div");

      user.className =
        "username";

      user.textContent =
        message.user ||
        "Unknown";

      user.style.color =
        getNameColor(
          message.user ||
          "Unknown"
        );


      /* TEXT */

      const text =
        document.createElement("div");

      text.className =
        "message-text";

      /*
        textContent is intentional.

        It prevents someone from putting HTML
        or scripts inside a message.
      */

      text.textContent =
        message.msg || "";


      bubble.appendChild(
        user
      );

      bubble.appendChild(
        text
      );


      /* TIME BELOW BUBBLE */

      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";


      const time =
        document.createElement("span");


      const date =
        new Date(
          message.time
        );


      time.textContent =
        isNaN(date.getTime())
          ? ""
          : date.toLocaleTimeString(
              [],
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );


      meta.appendChild(
        time
      );


      /*
        Source is only shown when it isn't
        the website.

        This helps distinguish Roblox/Discord
        messages without making the UI messy.
      */

      if (
        message.source &&
        message.source !== "website"
      ) {

        const source =
          document.createElement("span");

        source.textContent =
          "• " +
          message.source;

        meta.appendChild(
          source
        );

      }


      content.appendChild(
        bubble
      );

      content.appendChild(
        meta
      );


      wrapper.appendChild(
        content
      );


      messagesElement.appendChild(
        wrapper
      );


      /*
        Scroll only when the user is already
        near the bottom.

        This prevents jumping while reading
        older messages.
      */

      const distanceFromBottom =
        messagesElement.scrollHeight -
        messagesElement.scrollTop -
        messagesElement.clientHeight;


      if (
        distanceFromBottom < 300
      ) {

        requestAnimationFrame(
          () => {

            messagesElement.scrollTop =
              messagesElement.scrollHeight;

          }
        );

      }

    }


    /* =====================================================
       SEND
    ===================================================== */

    async function sendMessage() {

      const msg =
        messageInput.value.trim();


      if (!username) {

        loginScreen.style.display =
          "flex";

        return;

      }


      if (!msg) {
        return;
      }


      sendButton.disabled =
        true;


      try {

        const response =
          await fetch(
            SERVER_URL + "/send",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                user:
                  username,

                msg:
                  msg,

                source:
                  "website",

                private:
                  false

              })

            }
          );


        if (!response.ok) {

          const error =
            await response.text();

          throw new Error(
            "HTTP " +
            response.status +
            " " +
            error
          );

        }


        const result =
          await response.json();


        /*
          Render returns the newly-created message.

          Add it immediately.

          The fingerprint prevents the next polling
          request from displaying it again.
        */

        if (
          result &&
          result.message
        ) {

          addMessage(
            result.message
          );

        }


        messageInput.value =
          "";

        messageInput.focus();


      } catch (error) {

        console.error(
          "Send error:",
          error
        );


        setConnection(
          "error",
          "Send failed"
        );

        alert(
          "Message could not be sent.\n\n" +
          "Check that your Render server is running."
        );

      } finally {

        sendButton.disabled =
          false;

      }

    }


    /* =====================================================
       ENTER SEND
    ===================================================== */

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =====================================================
       EMOJIS
    ===================================================== */

    const emojis = [
      "😼","😃","🗿","😁","😆","😅","😏","🤣",
      "😊","😜","🙂","😏","😓","😌","😍","🥰",
      "😘","😎","🤩","🥳","🤔","🤪","🤔","🫡",
      "😴","😭","😡","🤯","🥺","😛","❤️","🙄",
      "🥵","😈","👽","👺","🔥","🤦🏻‍♂️","😾","💝",
      "👍","👎","💔","🥀","🙏","🤡","👀","✨",
      "🎉","👅","🫦","🖕🏻","💀","💐","🌚","❤️‍🔥"
    ];


    emojis.forEach(
      emoji => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "emoji";

        button.type =
          "button";

        button.textContent =
          emoji;


        button.onclick =
          () => {

            insertEmoji(
              emoji
            );

          };


        emojiPicker.appendChild(
          button
        );

      }
    );


    function toggleEmojiPicker() {

      emojiPicker.classList.toggle(
        "open"
      );

    }


    function insertEmoji(
      emoji
    ) {

      const start =
        messageInput.selectionStart;

      const end =
        messageInput.selectionEnd;

      const value =
        messageInput.value;


      messageInput.value =
        value.substring(
          0,
          start
        ) +
        emoji +
        value.substring(
          end
        );


      messageInput.focus();


      const position =
        start +
        emoji.length;


      messageInput.setSelectionRange(
        position,
        position
      );

    }


    /* Close emoji picker when clicking outside */

    document.addEventListener(
      "click",
      function(event) {

        if (
          !emojiPicker.contains(
            event.target
          ) &&
          event.target.id !==
            "emojiButton"
        ) {

          emojiPicker.classList.remove(
            "open"
          );

        }

      }
    );


    /* =====================================================
       START CHAT
    ===================================================== */

    function startChat() {

      loadMessages();


      /*
        Poll every 2 seconds.

        The lock + fingerprint system prevents
        duplicates.
      */

      setInterval(
        loadMessages,
        500
      );

    }

  </script>

</body>
</html>
