  </main>  <script>

    /* =====================================================
       SERVER
    ===================================================== */

    const SERVER_URL =
      "https://my-roblox-private-chat.onrender.com";


    /* =====================================================
       VARIABLES
    ===================================================== */

    let username = "";

    let lastMessageTime = 0;

    let loadingMessages = false;

    let chatStarted = false;

    const displayedMessages =
      new Set();


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginScreen =
      document.getElementById("loginScreen");

    const loginButton =
      document.getElementById("loginButton");

    const nameInput =
      document.getElementById("nameInput");

    const loginError =
      document.getElementById("loginError");

    const messagesElement =
      document.getElementById("messages");

    const emptyElement =
      document.getElementById("empty");

    const connection =
      document.getElementById("connection");

    const connectionText =
      document.getElementById("connectionText");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const emojiButton =
      document.getElementById("emojiButton");

    const emojiPicker =
      document.getElementById("emojiPicker");


    /* =====================================================
       NAME COLORS
    ===================================================== */

    const nameColors = [
      "#ff6b8a",
      "#ff9f43",
      "#ffd166",
      "#5ee1a2",
      "#55c7ff",
      "#7c8cff",
      "#b084ff",
      "#ff72d2",
      "#58d5c9",
      "#e989ff"
    ];


    function getNameColor(name) {

      let hash = 0;

      for (
        let i = 0;
        i < name.length;
        i++
      ) {

        hash =
          name.charCodeAt(i) +
          ((hash << 5) - hash);

      }

      const index =
        Math.abs(hash) %
        nameColors.length;

      return nameColors[index];
    }


    /* =====================================================
       LOGIN
    ===================================================== */

    function login() {

      const name =
        nameInput.value.trim();

      if (!name) {

        loginError.textContent =
          "Please enter a name.";

        nameInput.focus();

        return;
      }

      if (name.length < 2) {

        loginError.textContent =
          "Name must be at least 2 characters.";

        nameInput.focus();

        return;
      }

      username = name;

      try {

        localStorage.setItem(
          "mychat_username",
          username
        );

      } catch (error) {

        console.warn(
          "localStorage unavailable:",
          error
        );

      }

      loginError.textContent = "";

      loginScreen.style.display =
        "none";

      messageInput.focus();

      startChat();
    }


    loginButton.addEventListener(
      "click",
      login
    );


    /* =====================================================
       LOAD SAVED LOGIN
    ===================================================== */

    let savedUsername = null;

    try {

      savedUsername =
        localStorage.getItem(
          "mychat_username"
        );

    } catch (error) {

      console.warn(
        "Could not read localStorage:",
        error
      );

    }


    if (savedUsername) {

      username =
        savedUsername;

      loginScreen.style.display =
        "none";

      startChat();
    }


    /* =====================================================
       ENTER LOGIN
    ===================================================== */

    nameInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          login();
        }

      }
    );


    /* =====================================================
       CONNECTION
    ===================================================== */

    function setConnection(
      type,
      text
    ) {

      connection.className =
        "connection " + type;

      connectionText.textContent =
        text;
    }


    /* =====================================================
       MESSAGE FINGERPRINT
    ===================================================== */

    function messageFingerprint(message) {

      return [
        String(message.time || ""),
        String(message.user || ""),
        String(message.displayName || ""),
        String(message.msg || ""),
        String(message.source || ""),
        String(message.jobId || "")
      ].join("|||");
    }


    /* =====================================================
       LOAD MESSAGES
    ===================================================== */

    async function loadMessages() {

      if (loadingMessages) {
        return;
      }

      loadingMessages = true;

      try {

        const response =
          await fetch(
            SERVER_URL +
            "/messages?since=" +
            encodeURIComponent(
              lastMessageTime
            ),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (!Array.isArray(data)) {

          throw new Error(
            "Invalid server response"
          );

        }


        setConnection(
          "connected",
          "Connected"
        );


        data.sort(
          (a, b) =>
            Number(a.time || 0) -
            Number(b.time || 0)
        );


        data.forEach(
          addMessage
        );


      } catch (error) {

        console.error(
          "Message loading error:",
          error
        );


        setConnection(
          "error",
          "Connection error"
        );

      } finally {

        loadingMessages =
          false;
      }
    }


    /* =====================================================
       ADD MESSAGE
    ===================================================== */

    function addMessage(message) {

      const id =
        messageFingerprint(message);


      if (
        displayedMessages.has(id)
      ) {

        return;
      }


      displayedMessages.add(id);


      const messageTime =
        Number(message.time || 0);


      if (
        messageTime >
        lastMessageTime
      ) {

        lastMessageTime =
          messageTime;
      }


      emptyElement.style.display =
        "none";


      const wrapper =
        document.createElement("div");


      /*
        IMPORTANT:

        Use the Roblox username for determining
        whether the message belongs to us.

        Display name is only for visual display.
      */

      const isMine =
        message.user === username;


      wrapper.className =
        isMine
          ? "message mine"
          : "message";


      const content =
        document.createElement("div");

      content.className =
        "message-content";


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      /* =================================================
         DISPLAY NAME
      ================================================= */

      const user =
        document.createElement("div");

      user.className =
        "username";


      /*
        DISPLAY NAME FIRST.

        Falls back to username if the server
        doesn't provide displayName.
      */

      const displayName =
        message.displayName ||
        message.user ||
        "Unknown";


      user.textContent =
        displayName;


      /*
        Color based on username so the same
        account keeps the same color even if
        its display name changes.
      */

      user.style.color =
        getNameColor(
          message.user ||
          displayName
        );


      /* =================================================
         MESSAGE TEXT
      ================================================= */

      const text =
        document.createElement("div");

      text.className =
        "message-text";

      text.textContent =
        message.msg || "";


      bubble.appendChild(
        user
      );

      bubble.appendChild(
        text
      );


      /* =================================================
         META
      ================================================= */

      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";


      const time =
        document.createElement("span");


      const date =
        new Date(
          message.time
        );


      time.textContent =
        isNaN(date.getTime())
          ? ""
          : date.toLocaleTimeString(
              [],
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );


      meta.appendChild(
        time
      );


      if (
        message.source &&
        message.source !== "website"
      ) {

        const source =
          document.createElement("span");

        source.textContent =
          "• " +
          message.source;

        meta.appendChild(
          source
        );
      }


      content.appendChild(
        bubble
      );

      content.appendChild(
        meta
      );


      wrapper.appendChild(
        content
      );


      messagesElement.appendChild(
        wrapper
      );


      const distanceFromBottom =
        messagesElement.scrollHeight -
        messagesElement.scrollTop -
        messagesElement.clientHeight;


      if (
        distanceFromBottom < 300
      ) {

        requestAnimationFrame(
          () => {

            messagesElement.scrollTop =
              messagesElement.scrollHeight;

          }
        );
      }
    }


    /* =====================================================
       SEND
    ===================================================== */

    async function sendMessage() {

      const msg =
        messageInput.value.trim();


      if (!username) {

        loginScreen.style.display =
          "flex";

        return;
      }


      if (!msg) {
        return;
      }


      sendButton.disabled =
        true;


      try {

        const response =
          await fetch(
            SERVER_URL + "/send",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                user:
                  username,

                /*
                  Website users don't have a
                  separate Roblox display name
                  unless they provide one.
                */

                displayName:
                  username,

                msg:
                  msg,

                source:
                  "website",

                private:
                  false

              })
            }
          );


        if (!response.ok) {

          const error =
            await response.text();

          throw new Error(
            "HTTP " +
            response.status +
            " " +
            error
          );
        }


        const result =
          await response.json();


        if (
          result &&
          result.message
        ) {

          addMessage(
            result.message
          );
        }


        messageInput.value =
          "";

        messageInput.focus();


      } catch (error) {

        console.error(
          "Send error:",
          error
        );


        setConnection(
          "error",
          "Send failed"
        );


        alert(
          "Message could not be sent.\n\n" +
          "Check that your Render server is running."
        );


      } finally {

        sendButton.disabled =
          false;
      }
    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* =====================================================
       ENTER SEND
    ===================================================== */

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }

      }
    );


    /* =====================================================
       EMOJIS
    ===================================================== */

    const emojis = [
      "😼","😃","🗿","😁","😆","😅","😏","🤣",
      "😊","😜","🙂","😓","😌","😍","🥰",
      "😘","😎","🤩","🥳","🤔","🤪","🫡",
      "😴","😭","😡","🤯","🥺","😛","❤️","🙄",
      "🥵","😈","👽","👺","🔥","🤦🏻‍♂️","😾","💝",
      "👍","👎","💔","🥀","🙏","🤡","👀","✨",
      "🎉","👅","🫦","🖕🏻","💀","💐","🌚","❤️‍🔥"
    ];


    emojis.forEach(
      emoji => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "emoji";

        button.type =
          "button";

        button.textContent =
          emoji;


        button.addEventListener(
          "click",
          function() {

            insertEmoji(
              emoji
            );

          }
        );


        emojiPicker.appendChild(
          button
        );
      }
    );


    function toggleEmojiPicker() {

      emojiPicker.classList.toggle(
        "open"
      );
    }


    emojiButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        toggleEmojiPicker();
      }
    );


    function insertEmoji(
      emoji
    ) {

      const start =
        messageInput.selectionStart;

      const end =
        messageInput.selectionEnd;

      const value =
        messageInput.value;


      messageInput.value =
        value.substring(
          0,
          start
        ) +
        emoji +
        value.substring(
          end
        );


      messageInput.focus();


      const position =
        start +
        emoji.length;


      messageInput.setSelectionRange(
        position,
        position
      );
    }


    /* =====================================================
       CLOSE EMOJI PICKER
    ===================================================== */

    document.addEventListener(
      "click",
      function(event) {

        if (
          !emojiPicker.contains(
            event.target
          ) &&
          event.target !==
            emojiButton
        ) {

          emojiPicker.classList.remove(
            "open"
          );
        }
      }
    );


    /* =====================================================
       START CHAT
    ===================================================== */

    function startChat() {

      if (chatStarted) {
        return;
      }

      chatStarted = true;


      loadMessages();


      /*
        Poll every 500ms.

        The loading lock prevents overlapping
        requests and fingerprints prevent
        duplicate messages.
      */

      setInterval(
        loadMessages,
        500
      );
    }

  </script></body>
</html>
